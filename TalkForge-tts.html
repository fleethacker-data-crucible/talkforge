<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkForge-tts - Client-Side Text to Speech</title>
  <link rel="icon" href="assets/vendor/ui-kit/assets/favicon-32.png">
  <!-- FleetHacker UI kit v0.2.2. It is wrapped in @layer kit, so the page styles below still win. -->
  <link rel="stylesheet" href="assets/vendor/ui-kit/kit.css">
  <style>
    /* --bg, --border, --text, --muted, --accent and --on-accent come from the kit, including its light theme. */
    :root {
      --surface: var(--panel);
      --accent-hover: var(--link);
      --success: var(--ok);
      --danger: var(--err-bg);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 0.25rem; }
    main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; font-weight: 500; }
    select, textarea, button, input[type="range"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.95rem;
      height: auto;
    }
    textarea {
      min-height: 320px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 0.5rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.dragover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .controls { display: flex; flex-direction: column; gap: 0.75rem; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button {
      cursor: pointer;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      justify-content: center;
      font-weight: 600;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button.secondary { background: var(--sel); color: var(--text); }
    button.secondary:hover:not(:disabled) { filter: brightness(1.15); }
    button.danger { background: var(--danger); color: var(--on-status); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.4em;
    }
    .status.active { color: var(--success); }
    .progress {
      height: 6px;
      background: var(--border-strong);
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }
    .progress.show { display: block; }
    .progress > div {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s;
    }
    .mode-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .mode-group label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
    }
    .mode-group input { width: auto; }
    footer {
      text-align: center;
      padding: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    #debugPanel {
      margin: 1rem;
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-family: var(--mono), ui-monospace, Consolas, monospace;
      font-size: 0.75rem;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #debugPanel .log { color: var(--muted); }
    #debugPanel .warn { color: var(--warn); }
    #debugPanel .error { color: var(--err); }
    #debugPanel .status { color: var(--ok); }
    #debugToggle {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 100;
      background: var(--sel);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      width: auto;
    }
    fieldset.mode { border: 0; padding: 0; margin: 0; }
    fieldset.mode legend { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; font-weight: 500; padding: 0; }
    @media (forced-colors: active) {
      .progress > div { forced-color-adjust: none; background: Highlight; }
      #sourceBadge { border: 1px solid CanvasText; }
      button, #debugToggle { border: 1px solid ButtonText; }
      button:disabled { color: GrayText; border-color: GrayText; }
      .drop-zone.dragover { border-color: Highlight; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#text">Skip to text</a>
  <header>
    <h1>TalkForge-tts <span id="pageVersion" style="font-size:0.7rem;color:var(--muted);font-weight:400;"></span></h1>
    <div class="subtitle">Client-side neural text-to-speech · LibriTTS Medium by default · Fully offline after first load</div>
    <div id="sourceBadge" style="margin-top:0.4rem;font-size:0.75rem;padding:0.2rem 0.5rem;border-radius:6px;display:inline-block;background:var(--sel);color:var(--text);">Loading source…</div>
  </header>

  <main>
    <div class="panel drop-zone" id="dropZone">
      <label for="text">Drop or paste text here</label>
      <textarea id="text" placeholder="Paste a long document, article, or any text. Generation starts in the background as soon as text is available so playback and download stay responsive.">The quick brown fox jumps over the lazy dog. This is a demonstration of client-side Piper text-to-speech running entirely in your browser. You can paste long documents and begin listening immediately while the rest of the text is synthesized in the background.</textarea>
    </div>

    <div class="panel controls">
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="">Loading models…</option>
        </select>
      </div>

      <div>
        <label for="speed">Speed: <span id="speedValue">1.0×</span></label>
        <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>

      <div>
        <label for="volume">Volume: <span id="volumeValue">100%</span></label>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
      </div>

      <div>
        <label for="sectionLen">Section length</label>
        <select id="sectionLen">
          <option value="sentence">Sentence</option>
          <option value="20">20 words</option>
          <option value="40" selected>40 words</option>
        </select>
      </div>

      <div>
        <label for="voice">Voice / Speaker</label>
        <input type="search" id="voiceSearch" aria-label="Search speakers" placeholder="Search speakers…" style="margin-bottom:0.3rem;width:100%;">
        <select id="voice" size="6" style="height:auto;">
          <option value="0">Loading voices…</option>
        </select>
        <div class="row" style="margin-top:0.3rem;">
          <button id="favBtn" class="secondary" type="button" title="Star this speaker">★ Favorite</button>
          <button id="previewBtn" class="secondary" type="button">Preview</button>
        </div>
        <div id="voiceNote" style="font-size:0.75rem;color:var(--muted);margin-top:0.3rem;"></div>
      </div>

      <div>
        <label for="sampleText">Preview sentence</label>
        <input type="text" id="sampleText" value="This is a sample of the selected voice.">
      </div>

      <fieldset class="mode">
        <legend>Reading mode</legend>
        <div class="mode-group">
          <label><input type="radio" name="mode" value="all" checked> Read all</label>
          <label><input type="radio" name="mode" value="selection"> Read selection</label>
          <label><input type="radio" name="mode" value="click"> Read at click (click in text)</label>
        </div>
      </fieldset>

      <div class="row">
        <button id="play">Play</button>
        <button id="pause" class="secondary" type="button" disabled>Pause</button>
        <button id="stop" class="secondary" disabled>Stop</button>
      </div>
      <div class="row">
        <button id="prevSec" class="secondary" type="button" disabled>Prev</button>
        <button id="nextSec" class="secondary" type="button" disabled>Next</button>
      </div>
      <div class="row">
        <button id="uploadBtn" class="secondary">Upload text file</button>
        <input type="file" id="fileInput" accept=".txt,.md,.text,text/plain" style="display:none">
        <button id="clearBtn" class="secondary" type="button">Clear</button>
      </div>
      <div class="row">
        <button id="download" class="secondary">Download MP3</button>
        <button id="downloadWav" class="secondary" type="button">Download WAV</button>
      </div>
      <div class="row">
        <button id="themeBtn" class="secondary" type="button" aria-pressed="false">Light theme</button>
      </div>

      <div>
        <label for="pronounce">Pronunciation overrides (word=say, one per line)</label>
        <textarea id="pronounce" style="min-height:4rem;font-size:0.85rem;" placeholder="NATO=nay toe&#10;SQL=sequel"></textarea>
      </div>

      <div class="progress" id="progress" role="progressbar" aria-label="Synthesis progress" aria-valuemin="0" aria-valuemax="100"><div></div></div>
      <div class="status" id="status" role="status" aria-live="polite">Ready.</div>
      <div class="status" id="eta"></div>
    </div>
  </main>

  <footer id="footerText">
    Powered by Piper TTS (ONNX Runtime Web). Loading source information…
  </footer>

  <button id="debugToggle" type="button">Debug</button>
  <button id="copyDebug" type="button" style="position:fixed;bottom:1rem;right:6.5rem;z-index:100;width:auto;background:var(--sel);color:var(--text);border:1px solid var(--border-strong);border-radius:8px;padding:0.4rem 0.75rem;font-size:0.8rem;cursor:pointer;display:none;">Copy</button>
  <div id="debugPanel" role="log" aria-label="Debug log" tabindex="0" style="display:none;"></div>

  <script type="module">
    // ========== DEBUG PANEL ==========
    const PAGE_VERSION = '2.2.3';
    // The header version comes from PAGE_VERSION, so there is one place to bump it.
    document.getElementById('pageVersion').textContent = `v${PAGE_VERSION}`;

    const debugPanel = document.getElementById('debugPanel');
    const debugToggle = document.getElementById('debugToggle');
    const copyDebug = document.getElementById('copyDebug');
    let debugVisible = false;

    function appendDebug(msg, cls = 'log') {
      const line = document.createElement('div');
      line.className = cls;
      const ts = new Date().toISOString().slice(11, 23);
      line.textContent = `[${ts}] ${msg}`;
      debugPanel.appendChild(line);
      debugPanel.scrollTop = debugPanel.scrollHeight;
    }

    debugToggle.addEventListener('click', () => {
      debugVisible = !debugVisible;
      debugPanel.style.display = debugVisible ? 'block' : 'none';
      copyDebug.style.display = debugVisible ? 'block' : 'none';
      debugToggle.textContent = debugVisible ? 'Hide Debug' : 'Debug';
    });

    copyDebug.addEventListener('click', () => {
      const text = Array.from(debugPanel.querySelectorAll('div')).map(d => d.textContent).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        const orig = copyDebug.textContent;
        copyDebug.textContent = 'Copied!';
        setTimeout(() => { copyDebug.textContent = orig; }, 1200);
      }).catch(() => alert('Clipboard failed'));
    });

    // Capture console
    const origLog = console.log;
    const origWarn = console.warn;
    const origError = console.error;
    console.log = (...args) => { origLog.apply(console, args); appendDebug(args.map(String).join(' '), 'log'); };
    console.warn = (...args) => { origWarn.apply(console, args); appendDebug(args.map(String).join(' '), 'warn'); };
    console.error = (...args) => { origError.apply(console, args); appendDebug(args.map(String).join(' '), 'error'); };

    window.addEventListener('error', (e) => appendDebug(`Uncaught: ${e.message} (${e.filename}:${e.lineno})`, 'error'));
    window.addEventListener('unhandledrejection', (e) => appendDebug(`Unhandled rejection: ${e.reason}`, 'error'));

    function setFooter(text) {
      const el = document.getElementById('footerText');
      if (el) el.textContent = text;
    }
    // =================================

    // ========== LOCAL ASSET CONFIGURATION ==========
    // Local assets only. After populate-assets has run, the page needs no network.
    const ASSET_BASE = './assets';

    setSourceBadge('local', 'Local assets');

    function setSourceBadge(mode, label) {
      const badge = document.getElementById('sourceBadge');
      if (!badge) return;
      badge.textContent = label;
      if (mode === 'local') {
        badge.style.background = 'var(--ok-bg)';
        badge.style.color = 'var(--on-status)';
      } else {
        badge.style.background = 'var(--warn-bg)';
        badge.style.color = 'var(--on-status)';
      }
      setFooter(`Powered by Piper TTS (ONNX Runtime Web) v${PAGE_VERSION}. Source: ${label}. See LOCAL-ASSET-PLAYBOOK.md.`);
      appendDebug(`Source: ${label}`, 'status');
    }

    // Lazy-load lamejs from local assets only
    let lameLoaded = false;
    async function ensureLame() {
      if (lameLoaded) return;
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = `${ASSET_BASE}/vendor/lame.min.js`;
        s.onload = () => { lameLoaded = true; resolve(); };
        s.onerror = () => reject(new Error('Failed to load local lamejs. Run populate-assets first.'));
        document.head.appendChild(s);
      });
    }

    const textEl = document.getElementById('text');
    const modelEl = document.getElementById('model');
    const voiceEl = document.getElementById('voice');
    const speedEl = document.getElementById('speed');
    const speedValueEl = document.getElementById('speedValue');
    const playBtn = document.getElementById('play');
    const pauseBtn = document.getElementById('pause');
    const stopBtn = document.getElementById('stop');
    const prevBtn = document.getElementById('prevSec');
    const nextBtn = document.getElementById('nextSec');
    const downloadBtn = document.getElementById('download');
    const downloadWavBtn = document.getElementById('downloadWav');
    const clearBtn = document.getElementById('clearBtn');
    const previewBtn = document.getElementById('previewBtn');
    const favBtn = document.getElementById('favBtn');
    const themeBtn = document.getElementById('themeBtn');
    const volumeEl = document.getElementById('volume');
    const volumeValueEl = document.getElementById('volumeValue');
    const sectionLenEl = document.getElementById('sectionLen');
    const sampleTextEl = document.getElementById('sampleText');
    const pronounceEl = document.getElementById('pronounce');
    const etaEl = document.getElementById('eta');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const progressEl = document.getElementById('progress');
    const progressBar = progressEl.querySelector('div');
    const dropZone = document.getElementById('dropZone');

    let currentSession = null;
    let currentVoiceId = null;
    let isPlaying = false;
    let isPaused = false;
    let stopRequested = false;
    let skipDir = 0;          // -1 prev, 1 next, 0 none
    let currentChunkIndex = 0;
    let favorites = new Set();
    let audioQueue = [];          // { text, blob, url } for generated chunks
    let generatedBlobs = [];      // all successful audio blobs for the current text
    let generationController = null;

    const MULTI_SPEAKER_MODELS = new Set([
      'en_US-libritts_r-medium',
      'en_US-libritts-high'
    ]);

    function setStatus(msg, active = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('active', active);
      appendDebug(`Status: ${msg}`, 'status');
    }

    function showProgress(pct) {
      progressEl.classList.add('show');
      const v = Math.min(100, Math.max(0, pct));
      progressBar.style.width = v + '%';
      progressEl.setAttribute('aria-valuenow', String(Math.round(v)));
    }
    function hideProgress() {
      progressEl.classList.remove('show');
      progressBar.style.width = '0%';
    }

    // Import pure helpers (also tested under Node)
    const { splitSentences, filterSpeakers } = await import(`${ASSET_BASE}/vendor/tts-utils.js`);

    // Probe whether local phonemize data is reachable
    async function checkLocalWasm() {
      try {
        const resp = await fetch(`${ASSET_BASE}/wasm/piper_phonemize.data`, { method: 'HEAD' });
        return resp.ok;
      } catch {
        return false;
      }
    }

    const voiceSearch = document.getElementById('voiceSearch');
    let allSpeakers = [];

    async function populateVoices() {
      const model = modelEl.value;
      const note = document.getElementById('voiceNote');
      try {
        const eng = await ensureEngine(model);
        allSpeakers = eng.getSpeakers();
        renderSpeakerList('');
        if (note) note.textContent = allSpeakers.length > 1
          ? `${allSpeakers.length} speakers. Type to filter.`
          : 'Single-speaker model.';
      } catch (e) {
        voiceEl.innerHTML = '';
        const opt = document.createElement('option');
        opt.value = '0';
        opt.textContent = 'Default';
        voiceEl.appendChild(opt);
        if (note) note.textContent = 'Could not load speakers: ' + e.message;
      }
    }

    function renderSpeakerList(filter) {
      const matches = filterSpeakers(allSpeakers, filter);
      voiceEl.innerHTML = '';
      matches.slice(0, 200).forEach(s => {
        const opt = document.createElement('option');
        opt.value = String(s.id);
        opt.textContent = s.name;
        voiceEl.appendChild(opt);
      });
      if (matches.length > 200) {
        const opt = document.createElement('option');
        opt.disabled = true;
        opt.textContent = `… ${matches.length - 200} more (refine search)`;
        voiceEl.appendChild(opt);
      }
      if (matches.length && !voiceEl.value) voiceEl.selectedIndex = 0;
    }

    voiceSearch.addEventListener('input', () => renderSpeakerList(voiceSearch.value));

    speedEl.addEventListener('input', () => {
      speedValueEl.textContent = Number(speedEl.value).toFixed(1) + '×';
    });

    function getSpeed() {
      return Number(speedEl.value) || 1.0;
    }
    function getVolume() {
      return Number(volumeEl.value);
    }
    function getMaxWords() {
      const v = sectionLenEl.value;
      if (v === 'sentence') return 1000;
      return Number(v) || 40;
    }
    function applyPronunciation(text) {
      const rules = (pronounceEl.value || '').split('\n').map(l => l.trim()).filter(l => l.includes('='));
      let out = text;
      for (const rule of rules) {
        const [from, to] = rule.split('=').map(s => s.trim());
        if (!from || !to) continue;
        out = out.replace(new RegExp('\\b' + from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi'), to);
      }
      return out;
    }
    function estimateEta(chunks, fromIndex) {
      const remaining = chunks.slice(fromIndex).join(' ');
      const words = remaining.trim() ? remaining.trim().split(/\s+/).length : 0;
      const wps = 2.6 * getSpeed();
      const secs = Math.round(words / wps);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      etaEl.textContent = words ? `About ${m}:${String(s).padStart(2, '0')} remaining (${words} words)` : '';
    }

    // Persist preferences
    function savePrefs() {
      const prefs = {
        model: modelEl.value,
        speaker: voiceEl.value,
        speed: speedEl.value,
        volume: volumeEl.value,
        sectionLen: sectionLenEl.value,
        sample: sampleTextEl.value,
        theme: document.body.dataset.theme || 'dark',
        favorites: [...favorites]
      };
      localStorage.setItem('talkforge-prefs', JSON.stringify(prefs));
    }
    function loadPrefs() {
      try {
        const prefs = JSON.parse(localStorage.getItem('talkforge-prefs') || '{}');
        if (prefs.speed) { speedEl.value = prefs.speed; speedValueEl.textContent = Number(prefs.speed).toFixed(1) + '×'; }
        if (prefs.volume != null) { volumeEl.value = prefs.volume; volumeValueEl.textContent = Math.round(prefs.volume * 100) + '%'; }
        if (prefs.sectionLen) sectionLenEl.value = prefs.sectionLen;
        if (prefs.sample) sampleTextEl.value = prefs.sample;
        applyTheme(prefs.theme === 'light' ? 'light' : 'dark');
        if (Array.isArray(prefs.favorites)) favorites = new Set(prefs.favorites);
        return prefs;
      } catch { return {}; }
    }
    function applyTheme(mode) {
      document.body.dataset.theme = mode;
      // The UI kit holds both palettes and switches on <html data-theme>.
      document.documentElement.dataset.theme = mode === 'light' ? 'light' : 'dark';
      themeBtn.textContent = mode === 'light' ? 'Dark theme' : 'Light theme';
      themeBtn.setAttribute('aria-pressed', mode === 'light' ? 'true' : 'false');
    }

    // ========== MULTI-SPEAKER ENGINE ==========
    let engine = null;
    let engineModel = null;

    async function ensureEngine(modelId) {
      if (engine && engineModel === modelId) return engine;
      setStatus('Loading model with multi-speaker engine…');
      showProgress(0);
      const modelUrl = `${ASSET_BASE}/models/${modelId}.onnx`;
      const configUrl = `${ASSET_BASE}/models/${modelId}.onnx.json`;
      const wasmBase = `${ASSET_BASE}/vendor/onnx/`;
      const phonemePaths = {
        wasm: `${ASSET_BASE}/wasm/piper_phonemize.wasm`,
        data: `${ASSET_BASE}/wasm/piper_phonemize.data`
      };
      try {
        const { PiperEngine } = await import(`${ASSET_BASE}/vendor/piper-engine.js`);
        engine = await PiperEngine.load(modelUrl, configUrl, wasmBase, phonemePaths);
        engineModel = modelId;
        appendDebug(`PiperEngine loaded for ${modelId}. Speakers: ${engine.voiceConfig.num_speakers || 1}`, 'status');
        hideProgress();
        setStatus('Model ready');
        return engine;
      } catch (e) {
        hideProgress();
        setStatus('Engine load failed: ' + e.message);
        appendDebug('PiperEngine error: ' + e, 'error');
        throw e;
      }
    }
    // ==========================================

    async function generateChunk(text, voiceId, speakerId) {
      const eng = await ensureEngine(voiceId);
      const sid = Number(speakerId) || 0;
      const speed = parseFloat(speedEl.value) || 1.0;
      appendDebug(`PiperEngine.synthesize voice=${voiceId} speaker=${sid} speed=${speed} textLen=${text.length}`, 'status');
      const blob = await eng.synthesize(text, sid, speed);
      appendDebug(`Generated blob size=${blob.size}`, 'status');
      return blob;
    }

    // Persistent audio element — created and unlocked inside the user gesture
    let audioEl = null;
    function unlockAudio() {
      if (!audioEl) {
        audioEl = new Audio();
        audioEl.preload = 'auto';
      }
      // Silent unlock: play a tiny silent buffer so subsequent play() calls succeed on mobile
      const silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
      silent.play().catch(() => {});
      if (audioEl.play) {
        const p = audioEl.play();
        if (p && p.catch) p.catch(() => {});
        audioEl.pause();
        audioEl.currentTime = 0;
      }
    }

    // Highlight the word currently being spoken and keep it in view.
    let highlightTimer = null;
    function stopHighlight() {
      if (highlightTimer) { clearInterval(highlightTimer); highlightTimer = null; }
      // Leave the selection where it is so the user can see where reading stopped.
    }
    function startHighlight(chunk, fullText) {
      stopHighlight();
      // Don't override the user's selection in Read selection mode.
      const mode = document.querySelector('input[name="mode"]:checked')?.value;
      if (mode === 'selection') return;

      const words = chunk.trim().split(/\s+/).filter(Boolean);
      if (!words.length) return;
      const escaped = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      const m = new RegExp(escaped.join('\\s+')).exec(fullText);
      if (!m) return;

      // Select the whole section (stable) rather than guessing the current word.
      textEl.focus();
      textEl.setSelectionRange(m.index, m.index + m[0].length);
      const lineHeight = parseFloat(getComputedStyle(textEl).lineHeight) || 20;
      const charsPerLine = Math.max(1, Math.floor(textEl.clientWidth / 8));
      const line = Math.floor(m.index / charsPerLine);
      textEl.scrollTop = Math.max(0, line * lineHeight - textEl.clientHeight / 3);
    }

    async function playChunks(chunks, voiceId, speakerId) {
      isPlaying = true;
      isPaused = false;
      stopRequested = false;
      skipDir = 0;
      playBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
      prevBtn.disabled = false;
      nextBtn.disabled = false;
      generatedBlobs = [];
      audioQueue = [];

      setStatus('Generating and playing…', true);

      // Pipeline: keep two sections synthesized ahead.
      // A voice change discards prefetched audio and applies on the next section.
      const LOOKAHEAD = 4;
      const queue = []; // { idx, promise, voice, speaker }
      const currentVoice = () => modelEl.value;
      const currentSpeaker = () => voiceEl.value;

      const startNext = (idx, v, s) => {
        if (idx >= chunks.length || stopRequested) return null;
        const c = chunks[idx];
        if (idx === 0 && pregenBlob && pregenKey && pregenKey.startsWith(v + ':' + s)) {
          const b = pregenBlob;
          pregenBlob = null;
          return Promise.resolve(b);
        }
        return generateChunk(c, v, s);
      };

      const fillQueue = () => {
        while (queue.length < LOOKAHEAD) {
          const idx = queue.length ? queue[queue.length - 1].idx + 1 : 0;
          if (idx >= chunks.length) break;
          const v = currentVoice();
          const s = currentSpeaker();
          queue.push({ idx, promise: startNext(idx, v, s), voice: v, speaker: s });
        }
      };
      fillQueue();

      const fullText = textEl.value;

      for (let i = 0; i < chunks.length && !stopRequested; i++) {
        if (skipDir === 1) { skipDir = 0; continue; }
        if (skipDir === -1) { skipDir = 0; i = Math.max(0, i - 2); }
        currentChunkIndex = i;
        const chunk = chunks[i];
        setStatus(`Playing ${i + 1}/${chunks.length}…`, true);
        estimateEta(chunks, i);
        try {
          let item = queue.shift();
          const liveVoice = currentVoice();
          const liveSpeaker = currentSpeaker();
          if (!item || item.voice !== liveVoice || item.speaker !== liveSpeaker) {
            appendDebug(`Voice changed; section ${i + 1} uses ${liveVoice} / ${liveSpeaker}`, 'status');
            item = { idx: i, promise: startNext(i, liveVoice, liveSpeaker), voice: liveVoice, speaker: liveSpeaker };
            queue.length = 0;
          }
          const blob = await item.promise;
          fillQueue();

          generatedBlobs.push(blob);
          const url = URL.createObjectURL(blob);
          audioQueue.push({ text: chunk, blob, url });

          audioEl.src = url;
          audioEl.playbackRate = getSpeed();
          audioEl.volume = getVolume();
          startHighlight(chunk, fullText);
          await new Promise((resolve, reject) => {
            const onEnd = () => { cleanup(); resolve(); };
            const onErr = (e) => { cleanup(); reject(e); };
            const cleanup = () => {
              audioEl.removeEventListener('ended', onEnd);
              audioEl.removeEventListener('error', onErr);
              clearInterval(check);
              stopHighlight();
            };
            audioEl.addEventListener('ended', onEnd);
            audioEl.addEventListener('error', onErr);
            const playPromise = audioEl.play();
            if (playPromise && playPromise.catch) {
              playPromise.catch((err) => {
                setStatus('Playback blocked. Tap again or check volume. ' + err.message);
                cleanup();
                reject(err);
              });
            }
            const check = setInterval(() => {
              if (stopRequested || skipDir !== 0) {
                audioEl.pause();
                cleanup();
                resolve();
              }
              if (isPaused) audioEl.pause();
            }, 100);
          });
        } catch (e) {
          console.error(e);
          setStatus('Error on chunk ' + (i + 1) + ': ' + (e.message || e));
          break;
        }
      }

      stopHighlight();
      isPlaying = false;
      isPaused = false;
      playBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      etaEl.textContent = '';
      if (!stopRequested) setStatus('Finished. Download is ready.');
      else setStatus('Stopped.');
    }

    function getTextToRead() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const full = textEl.value;
      if (mode === 'selection') {
        const start = textEl.selectionStart;
        const end = textEl.selectionEnd;
        if (start !== end) return full.slice(start, end);
        return full; // fallback
      }
      if (mode === 'click') {
        // For click mode, user clicks in textarea; we use selection or cursor position
        const pos = textEl.selectionStart;
        return full.slice(pos);
      }
      return full;
    }

    playBtn.addEventListener('click', async () => {
      // Unlock audio immediately inside the user gesture (critical for Android Chrome)
      unlockAudio();

      const text = applyPronunciation(getTextToRead().trim());
      if (!text) {
        setStatus('No text to read.');
        return;
      }
      const voiceId = modelEl.value;
      const speakerId = voiceEl.value;
      const chunks = splitSentences(text, getMaxWords());
      if (!chunks.length) return;
      await playChunks(chunks, voiceId, speakerId);
    });

    stopBtn.addEventListener('click', () => {
      stopRequested = true;
      isPaused = false;
      setStatus('Stopping…');
    });
    pauseBtn.addEventListener('click', () => {
      if (!isPlaying) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
      if (!isPaused) audioEl.play();
      setStatus(isPaused ? 'Paused.' : 'Resumed.');
    });
    prevBtn.addEventListener('click', () => { if (isPlaying) skipDir = -1; });
    nextBtn.addEventListener('click', () => { if (isPlaying) skipDir = 1; });
    clearBtn.addEventListener('click', () => { textEl.value = ''; setStatus('Cleared.'); });
    previewBtn.addEventListener('click', async () => {
      unlockAudio();
      const text = applyPronunciation(sampleTextEl.value.trim() || 'This is a sample of the selected voice.');
      const chunks = splitSentences(text, getMaxWords());
      if (!chunks.length) return;
      await playChunks(chunks, modelEl.value, voiceEl.value);
    });
    favBtn.addEventListener('click', () => {
      const id = modelEl.value + ':' + voiceEl.value;
      if (favorites.has(id)) favorites.delete(id);
      else favorites.add(id);
      favBtn.textContent = favorites.has(id) ? '★ Favorited' : '★ Favorite';
      savePrefs();
    });
    themeBtn.addEventListener('click', () => {
      const next = (document.body.dataset.theme === 'light') ? 'dark' : 'light';
      applyTheme(next);
      savePrefs();
    });
    volumeEl.addEventListener('input', () => {
      volumeValueEl.textContent = Math.round(getVolume() * 100) + '%';
      if (audioEl) audioEl.volume = getVolume();
      savePrefs();
    });
    sectionLenEl.addEventListener('change', savePrefs);
    sampleTextEl.addEventListener('change', savePrefs);
    speedEl.addEventListener('change', savePrefs);
    modelEl.addEventListener('change', () => {
      savePrefs();
      const id = modelEl.value + ':' + voiceEl.value;
      favBtn.textContent = favorites.has(id) ? '★ Favorited' : '★ Favorite';
    });
    voiceEl.addEventListener('change', () => {
      savePrefs();
      const id = modelEl.value + ':' + voiceEl.value;
      favBtn.textContent = favorites.has(id) ? '★ Favorited' : '★ Favorite';
    });

    downloadWavBtn.addEventListener('click', async () => {
      const full = textEl.value;
      const start = textEl.selectionStart;
      const end = textEl.selectionEnd;
      const hasSelection = start !== end;
      const target = applyPronunciation(hasSelection ? full.slice(start, end) : full);
      if (!target.trim()) { setStatus('Nothing to download.'); return; }
      const chunks = splitSentences(target.trim(), getMaxWords());
      downloadWavBtn.disabled = true;
      const blobs = [];
      try {
        for (let i = 0; i < chunks.length; i++) {
          setStatus(`Synthesizing ${i + 1}/${chunks.length} for WAV…`, true);
          blobs.push(await generateChunk(chunks[i], modelEl.value, voiceEl.value));
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(blobs, { type: 'audio/wav' }));
        a.download = hasSelection ? 'speech-selection.wav' : 'speech.wav';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        setStatus(`WAV downloaded (${blobs.length} section(s)).`);
      } catch (e) {
        setStatus('WAV failed: ' + (e.message || e));
      } finally {
        downloadWavBtn.disabled = false;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.target === textEl || e.target === pronounceEl || e.target === sampleTextEl || e.target === voiceSearch) return;
      if (e.code === 'Space') { e.preventDefault(); isPlaying ? pauseBtn.click() : playBtn.click(); }
      else if (e.code === 'Escape') stopBtn.click();
      else if (e.code === 'ArrowRight') nextBtn.click();
      else if (e.code === 'ArrowLeft') prevBtn.click();
    });

    loadPrefs();

    // Non-blocking first-sentence pre-synthesis
    let pregenBlob = null;
    let pregenKey = null;

    function preSynthesizeFirst() {
      if (isPlaying) return;
      const text = textEl.value.trim();
      if (!text) return;
      const chunks = splitSentences(text);
      if (!chunks.length) return;
      const voiceId = modelEl.value;
      const speakerId = voiceEl.value;
      const key = voiceId + ':' + speakerId + ':' + chunks[0].slice(0, 40);
      if (pregenKey === key && pregenBlob) return; // already done
      pregenKey = key;
      pregenBlob = null;
      appendDebug('Background pre-synthesizing first sentence…', 'status');
      generateChunk(chunks[0], voiceId, speakerId)
        .then(blob => {
          if (pregenKey === key) {
            pregenBlob = blob;
            appendDebug('First sentence ready in background', 'status');
          }
        })
        .catch(e => appendDebug('Pre-synth failed: ' + e.message, 'warn'));
    }

    // Background preparation on text change
    let prepTimer;
    textEl.addEventListener('input', () => {
      clearTimeout(prepTimer);
      prepTimer = setTimeout(() => {
        const text = textEl.value.trim();
        if (!text || isPlaying) return;
        const chunks = splitSentences(text);
        if (chunks.length === 0) return;
        setStatus(`Prepared ${chunks.length} section(s).`, true);
        preSynthesizeFirst();
      }, 400);
    });

    // Click-to-read: start from the click position (do not require Play)
    textEl.addEventListener('click', () => {
      if (document.querySelector('input[name="mode"]:checked').value === 'click') {
        setTimeout(() => {
          unlockAudio();
          const text = getTextToRead().trim();
          if (!text) return;
          const voiceId = modelEl.value;
          const speakerId = voiceEl.value;
          const chunks = splitSentences(text);
          if (chunks.length) playChunks(chunks, voiceId, speakerId);
        }, 0);
      }
    });

    // Upload text file
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        textEl.value = reader.result;
        textEl.dispatchEvent(new Event('input'));
        setStatus('Loaded ' + file.name);
        appendDebug('Uploaded file: ' + file.name, 'status');
      };
      reader.onerror = () => setStatus('Failed to read file');
      reader.readAsText(file);
      fileInput.value = ''; // allow re-uploading the same file
    });

    async function loadModelList() {
      try {
        const resp = await fetch(`${ASSET_BASE}/models.json`);
        if (!resp.ok) throw new Error('models.json not found');
        const data = await resp.json();
        modelEl.innerHTML = '';
        let defaultId = null;
        for (const m of data.models || []) {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.label || m.id;
          modelEl.appendChild(opt);
          if (m.default) defaultId = m.id;
        }
        if (defaultId) modelEl.value = defaultId;
        else if (modelEl.options.length) modelEl.selectedIndex = 0;
        appendDebug(`Loaded ${modelEl.options.length} models from models.json`, 'status');
      } catch (e) {
        appendDebug('models.json load failed: ' + e.message + ' — using fallback list', 'warn');
        // Fallback static list
        modelEl.innerHTML = '';
        const fallback = [
          { id: 'en_US-libritts_r-medium', label: 'LibriTTS-R Medium' },
          { id: 'en_US-lessac-medium', label: 'Lessac Medium' }
        ];
        fallback.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.label;
          modelEl.appendChild(opt);
        });
      }
    }

    modelEl.addEventListener('change', () => {
      currentSession = null;
      currentVoiceId = null;
      populateVoices();
      setStatus('Model changed.');
      preSynthesizeFirst();
    });
    voiceEl.addEventListener('change', () => {
      currentSession = null;
      currentVoiceId = null;
      setStatus('Speaker changed to ' + voiceEl.value);
      preSynthesizeFirst();
    });
    loadModelList().then(() => {
      populateVoices();
      // Kick off first-sentence synthesis as soon as the page is ready
      setTimeout(preSynthesizeFirst, 300);
    });

    // Drag & drop
    ['dragenter', 'dragover'].forEach(ev => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      });
    });
    dropZone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('text')) {
        const reader = new FileReader();
        reader.onload = () => { textEl.value = reader.result; textEl.dispatchEvent(new Event('input')); };
        reader.readAsText(file);
      } else if (e.dataTransfer.getData('text')) {
        textEl.value = e.dataTransfer.getData('text');
        textEl.dispatchEvent(new Event('input'));
      }
    });

    async function concatAndEncodeMp3(blobs) {
      if (!blobs.length) throw new Error('No audio to encode');
      await ensureLame();

      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const buffers = [];
      let sampleRate = 22050;

      for (const blob of blobs) {
        const arrayBuffer = await blob.arrayBuffer();
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
        buffers.push(audioBuffer);
        sampleRate = audioBuffer.sampleRate;
      }

      // Concatenate mono channel data
      const totalLength = buffers.reduce((sum, b) => sum + b.length, 0);
      const combined = new Float32Array(totalLength);
      let offset = 0;
      for (const buf of buffers) {
        const channel = buf.getChannelData(0);
        combined.set(channel, offset);
        offset += channel.length;
      }

      // Convert Float32 [-1,1] to Int16
      const samples = new Int16Array(combined.length);
      for (let i = 0; i < combined.length; i++) {
        const s = Math.max(-1, Math.min(1, combined[i]));
        samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      const encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
      const mp3Data = [];
      const blockSize = 1152;
      for (let i = 0; i < samples.length; i += blockSize) {
        const chunk = samples.subarray(i, i + blockSize);
        const buf = encoder.encodeBuffer(chunk);
        if (buf.length > 0) mp3Data.push(buf);
      }
      const end = encoder.flush();
      if (end.length > 0) mp3Data.push(end);

      await ctx.close();
      return new Blob(mp3Data, { type: 'audio/mpeg' });
    }

    function updateDownloadLabel() {
      const start = textEl.selectionStart;
      const end = textEl.selectionEnd;
      if (start !== end) {
        downloadBtn.textContent = 'Download Selection as MP3';
      } else {
        downloadBtn.textContent = 'Download MP3';
      }
    }
    textEl.addEventListener('select', updateDownloadLabel);
    textEl.addEventListener('mouseup', updateDownloadLabel);
    textEl.addEventListener('keyup', updateDownloadLabel);
    document.addEventListener('selectionchange', updateDownloadLabel);

    downloadBtn.addEventListener('click', async () => {
      const full = textEl.value;
      const start = textEl.selectionStart;
      const end = textEl.selectionEnd;
      const hasSelection = start !== end;
      const target = hasSelection ? full.slice(start, end) : full;
      const label = hasSelection ? 'selection' : 'document';

      if (!target.trim()) {
        setStatus('Nothing to download.');
        return;
      }

      const voiceId = modelEl.value;
      const speakerId = voiceEl.value;
      const chunks = splitSentences(applyPronunciation(target.trim()), getMaxWords());
      if (!chunks.length) {
        setStatus('No text to encode.');
        return;
      }

      downloadBtn.disabled = true;
      setStatus(`Generating ${chunks.length} section(s) for ${label}…`, true);
      const blobs = [];
      try {
        for (let i = 0; i < chunks.length; i++) {
          setStatus(`Synthesizing ${i + 1}/${chunks.length} for ${label}…`, true);
          const blob = await generateChunk(chunks[i], voiceId, speakerId);
          blobs.push(blob);
        }
        setStatus(`Encoding MP3 (${blobs.length} section(s))…`, true);
        const mp3Blob = await concatAndEncodeMp3(blobs);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(mp3Blob);
        a.download = hasSelection ? 'speech-selection.mp3' : 'speech.mp3';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        setStatus(`MP3 downloaded (${blobs.length} section(s), ${label}).`);
      } catch (e) {
        console.error(e);
        setStatus('MP3 failed: ' + (e.message || e));
      } finally {
        downloadBtn.disabled = false;
      }
    });

    // Initial warm-up hint
    setStatus('Ready. On mobile, tap Play (audio is unlocked immediately). First use downloads the model.');
  </script>
</body>
</html>
