name: Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download models and WASM
        run: |
          chmod +x populate-assets.sh
          ./populate-assets.sh

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "TalkForge $TAG" \
            --notes "Models and large WASM generated by CI from populate-assets.sh." \
            --target main \
            assets/models/*.onnx \
            assets/wasm/piper_phonemize.data \
            assets/wasm/onnx/*.wasm || \
          gh release upload "$TAG" \
            assets/models/*.onnx \
            assets/wasm/piper_phonemize.data \
            assets/wasm/onnx/*.wasm --clobber
