name: Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp release base for zip/source downloads
        run: |
          mkdir -p assets
          # Stamp the .0 series base so patch releases reuse the same large assets.
          # e.g. v1.0.1 → https://github.com/owner/repo/releases/download/v1.0.0
          TAG="${GITHUB_REF#refs/tags/}"
          SERIES="${TAG%.*}.0"
          echo "https://github.com/${{ github.repository }}/releases/download/${SERIES}" > assets/release-base.txt
          echo "Stamped series base: $(cat assets/release-base.txt)"

      - name: Commit stamp back to the repo
        # Simple commit-back so the next "Code → Download ZIP" contains the correct base.
        # Uses the default GITHUB_TOKEN (contents: write is already set above).
        # Pushes with this token do not re-trigger workflows.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/release-base.txt
          # Only commit if the stamp actually changed
          if git diff --cached --quiet; then
            echo "No stamp change; skipping commit."
          else
            git commit -m "Stamp release-base.txt for ${GITHUB_REF#refs/tags/}"
            # Tag checkouts are detached HEAD, so push explicitly to main.
            git push origin HEAD:main
          fi

      - name: Download models and WASM
        # Only fetch large assets when this is a .0 series release.
        if: endsWith(github.ref, '.0')
        run: |
          chmod +x populate-assets.sh
          ./populate-assets.sh

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES="Models and large WASM live on the .0 series release and are reused by patch releases."
          if [[ "$TAG" == *.0 ]]; then
            gh release create "$TAG" \
              --title "TalkForge $TAG" \
              --notes "$NOTES" \
              --target main \
              assets/release-base.txt \
              assets/models/*.onnx \
              assets/wasm/piper_phonemize.data \
              assets/wasm/onnx/*.wasm || \
            gh release upload "$TAG" \
              assets/release-base.txt \
              assets/models/*.onnx \
              assets/wasm/piper_phonemize.data \
              assets/wasm/onnx/*.wasm --clobber
          else
            # Patch release: stamp only, no large assets.
            gh release create "$TAG" \
              --title "TalkForge $TAG" \
              --notes "$NOTES" \
              --target main \
              assets/release-base.txt || true
          fi
