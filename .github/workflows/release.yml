name: Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp release base for zip/source downloads
        run: |
          mkdir -p assets
          # Stamp the .0 series base so patch releases reuse the same large assets.
          # e.g. v1.0.1 → https://github.com/owner/repo/releases/download/v1.0.0
          TAG="${GITHUB_REF#refs/tags/}"
          SERIES="${TAG%.*}.0"
          echo "https://github.com/${{ github.repository }}/releases/download/${SERIES}" > assets/release-base.txt
          echo "Stamped series base: $(cat assets/release-base.txt)"

      - name: Commit stamp back to the repo
        # Simple commit-back so the next "Code → Download ZIP" contains the correct base.
        # Uses the default GITHUB_TOKEN (contents: write is already set above).
        # Pushes with this token do not re-trigger workflows.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/release-base.txt
          # Only commit if the stamp actually changed
          if git diff --cached --quiet; then
            echo "No stamp change; skipping commit."
          else
            git commit -m "Stamp release-base.txt for ${GITHUB_REF#refs/tags/}"
            # Tag checkouts are detached HEAD, so push explicitly to main.
            git push origin HEAD:main
          fi

      - name: Download models and WASM
        # Only fetch large assets when this is a .0 series release.
        if: ${{ endsWith(github.ref, '.0') }}
        run: |
          chmod +x populate-assets.sh
          ./populate-assets.sh

      - name: Build plain-folder source archive
        # GitHub's auto source zip/tar.gz always extracts to a versioned folder
        # (talkforge-1.1.0/). We ship a custom archive that extracts to talkforge/
        # with a VERSION file inside so upgrades are a simple extract-over.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p /tmp/talkforge
          rsync -a --exclude='.git' ./ /tmp/talkforge/
          echo "$TAG" > /tmp/talkforge/VERSION
          tar -C /tmp -czf talkforge-src.tar.gz talkforge
          (cd /tmp && zip -r -q "$GITHUB_WORKSPACE/talkforge-src.zip" talkforge)
          echo "Built talkforge-src.tar.gz and talkforge-src.zip (extracts to talkforge/)"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" << 'EOF'
          Models and large WASM live on the .0 series release and are reused by patch releases.

          Source archive (extracts to talkforge/ with a VERSION file inside):
          - talkforge-src.zip
          - talkforge-src.tar.gz

          Prefer these over the auto-generated source archives if you want a version-free folder name for easier upgrades.
          EOF
          if [[ "$TAG" == *.0 ]]; then
            gh release create "$TAG" \
              --title "TalkForge $TAG" \
              --notes-file "$NOTES_FILE" \
              --target main \
              talkforge-src.zip \
              talkforge-src.tar.gz \
              assets/release-base.txt \
              assets/models/*.onnx \
              assets/wasm/piper_phonemize.data \
              assets/wasm/onnx/*.wasm || \
            gh release upload "$TAG" \
              talkforge-src.zip \
              talkforge-src.tar.gz \
              assets/release-base.txt \
              assets/models/*.onnx \
              assets/wasm/piper_phonemize.data \
              assets/wasm/onnx/*.wasm --clobber
          else
            # Patch release: stamp + plain source archive, no large assets.
            gh release create "$TAG" \
              --title "TalkForge $TAG" \
              --notes-file "$NOTES_FILE" \
              --target main \
              talkforge-src.zip \
              talkforge-src.tar.gz \
              assets/release-base.txt || true
          fi
