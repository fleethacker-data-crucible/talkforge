name: Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp release base for zip/source downloads
        run: |
          mkdir -p assets
          # Write the base URL that matches the repo and tag that triggered this run.
          # Source-zip downloads will contain this file after the commit-back below.
          echo "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF#refs/tags/}" > assets/release-base.txt
          echo "Stamped: $(cat assets/release-base.txt)"

      - name: Commit stamp back to the repo
        # Simple commit-back so the next "Code → Download ZIP" contains the correct base.
        # Uses the default GITHUB_TOKEN (contents: write is already set above).
        # Pushes with this token do not re-trigger workflows.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/release-base.txt
          # Only commit if the stamp actually changed
          if git diff --cached --quiet; then
            echo "No stamp change; skipping commit."
          else
            git commit -m "Stamp release-base.txt for ${GITHUB_REF#refs/tags/}"
            git push
          fi

      - name: Download models and WASM
        run: |
          chmod +x populate-assets.sh
          ./populate-assets.sh

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "TalkForge $TAG" \
            --notes "Models and large WASM generated by CI from populate-assets.sh." \
            --target main \
            assets/release-base.txt \
            assets/models/*.onnx \
            assets/wasm/piper_phonemize.data \
            assets/wasm/onnx/*.wasm || \
          gh release upload "$TAG" \
            assets/release-base.txt \
            assets/models/*.onnx \
            assets/wasm/piper_phonemize.data \
            assets/wasm/onnx/*.wasm --clobber
