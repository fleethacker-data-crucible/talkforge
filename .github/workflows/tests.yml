name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSET_TAG: v1.3.0
  # Smallest voice: keeps the CI download to about 100 MB.
  TALKFORGE_TEST_VOICE: en_US-libritts-high

jobs:
  unit:
    name: Node unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run all Node tests
        run: |
          set -e
          for f in tests/*.test.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  smoke:
    name: Offline synthesis smoke test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache assets
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            assets/models/en_US-libritts-high.onnx
            assets/vendor/onnx/ort-wasm-simd-threaded.jsep.wasm
            assets/wasm/piper_phonemize.data
          key: assets-${{ env.ASSET_TAG }}-${{ hashFiles('assets-manifest.json') }}

      - name: Download pinned release assets
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p dl
          gh release download "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern 'en_US-libritts-high.onnx' \
            --pattern 'ort-wasm-simd-threaded.jsep.wasm' \
            --pattern 'piper_phonemize.data'
          mkdir -p assets/models assets/vendor/onnx assets/wasm
          mv dl/en_US-libritts-high.onnx assets/models/
          mv dl/ort-wasm-simd-threaded.jsep.wasm assets/vendor/onnx/
          mv dl/piper_phonemize.data assets/wasm/

      - name: Verify SHA-256 of the assets (fails on any mismatch)
        run: |
          # Files are already in place, so populate-assets only verifies them and never downloads.
          TALKFORGE_ONLY='models/en_US-libritts-high.onnx,models/en_US-libritts-high.onnx.json,vendor/onnx/ort-wasm-simd-threaded.jsep.wasm,wasm/piper_phonemize.*' \
            bash ./populate-assets.sh

      - name: Offline synthesis smoke test (real engine, WAV valid and non-silent)
        env:
          TALKFORGE_REQUIRE_ASSETS: '1'
        run: node tests/smoke-synth.test.mjs

      - name: Voiceover CLI end to end
        env:
          TALKFORGE_REQUIRE_ASSETS: '1'
        run: node tests/synth-cli.test.mjs

      - name: Headless endpoint and speak end to end
        env:
          TALKFORGE_REQUIRE_ASSETS: '1'
        run: node tests/headless.test.mjs

      - name: Lifecycle (heartbeat, idle timeout) with real process
        env:
          TALKFORGE_REQUIRE_ASSETS: '1'
        run: node tests/lifecycle.test.mjs
