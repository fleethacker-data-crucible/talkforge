name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Node unit tests
    runs-on: ubuntu-26.04
    # Optional for now — failure does not block merges
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run pure-function tests
        run: node tests/tts-utils.test.mjs

      - name: Run syntax checks
        run: node tests/syntax.test.mjs
