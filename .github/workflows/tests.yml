name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    # Optional for now — failure does not block merges
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pure-function tests
        run: node tests/tts-utils.test.mjs
